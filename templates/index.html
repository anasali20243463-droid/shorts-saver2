<!DOCTYPE html>
<html>

<head>

<title>Nova Downloader</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#1f4037,#99f2c8);

color:white;

}

.container{

background:rgba(255,255,255,0.1);
backdrop-filter:blur(20px);

padding:50px;

border-radius:20px;

text-align:center;

width:450px;

box-shadow:0 25px 80px rgba(0,0,0,0.5);

}

h1{

font-size:32px;
margin-bottom:10px;

}

p{

opacity:0.8;
margin-bottom:25px;

}

input{

width:100%;

padding:14px;

border:none;

border-radius:10px;

outline:none;

margin-bottom:20px;

font-size:15px;

}

button{

width:100%;

padding:14px;

border:none;

border-radius:10px;

font-size:16px;

cursor:pointer;

background:linear-gradient(90deg,#ff512f,#dd2476);

color:white;

transition:0.3s;

}

button:hover{

transform:scale(1.05);

}

.bar{

margin-top:30px;

width:100%;

height:22px;

background:#eee;

border-radius:20px;

overflow:hidden;

display:none;

}

.progress{

height:100%;

width:0%;

background:linear-gradient(90deg,#00c6ff,#0072ff);

transition:0.3s;

}

#percent{

margin-top:10px;

}

#done{

margin-top:15px;
font-size:18px;

}

</style>

</head>

<body>

<div class="container">

<h1>🚀 Nova Downloader</h1>

<p>Download YouTube videos instantly</p>

<input id="url" placeholder="Paste YouTube URL here">

<button onclick="startDownload()">Download</button>

<div class="bar" id="bar">

<div class="progress" id="progress"></div>

</div>

<p id="percent"></p>

<h3 id="done"></h3>

</div>

<script>

function startDownload(){

let url=document.getElementById("url").value

fetch("/start_download",{
method:"POST",
headers:{
"Content-Type":"application/x-www-form-urlencoded"
},
body:"url="+encodeURIComponent(url)
})

document.getElementById("bar").style.display="block"

var source=new EventSource("/progress")

source.onmessage=function(event){

let data=JSON.parse(event.data)

let percent=data.percent

document.getElementById("progress").style.width=percent+"%"

document.getElementById("percent").innerText=percent+"%"

if(percent>=100){

document.getElementById("done").innerHTML="✅ Download Complete!"

source.close()

}

}

}

</script>

</body>
</html>
